name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Test-only value: tokens are signed against an in-memory SQLite database
      # that is discarded after the run. This is NOT a production secret.
      JWT_SECRET: test-only-not-a-real-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit Test
        run: npm run test:unit

      - name: Integration Test
        run: npm run test:integration
